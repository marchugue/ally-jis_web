<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png"  href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Ally-jis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var path = window.location.pathname || '';
          var protectedRoutes = [
            '/dashboard',
            '/discover',
            '/messages',
            '/requests',
            '/profile',
            '/notifications',
            '/blocked-users',
            '/settings',
            '/pending-approval'
          ];
          var isProtected = false;
          for (var i = 0; i < protectedRoutes.length; i++) {
            var prefix = protectedRoutes[i];
            if (path === prefix || path.indexOf(prefix + '/') === 0) {
              isProtected = true;
              break;
            }
          }

          if (isProtected) {
            var saved = localStorage.getItem('ally-theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || ((!saved || saved === 'system') && prefersDark)) {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
              return;
            }
          }

          // Welcome page, login, onboarding, and public pages strictly stay in light mode
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
